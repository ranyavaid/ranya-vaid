<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal portfolio" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back_ios"
    />

    <title>Ranya Vaid</title>
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual'
      }
    </script>
  </head>
  <body>
    <script>
      ;(function () {
        function detectBase() {
          var el = document.querySelector('script[type="module"][src*="/assets/"]')
          if (!el || !el.src) return '/'
          try {
            var path = new URL(el.src, location.href).pathname
            var idx = path.indexOf('/assets/')
            return idx > 0 ? path.slice(0, idx + 1) : '/'
          } catch (e) {
            return '/'
          }
        }

        var base = detectBase()
        if (base === '/') return

        function prefixSrc(src) {
          if (!src || !src.startsWith('/') || src.startsWith('//') || src.startsWith(base)) {
            return src
          }
          return base + src.slice(1)
        }

        function fixImages(root) {
          root.querySelectorAll('img[src^="/"]').forEach(function (img) {
            var current = img.getAttribute('src')
            var next = prefixSrc(current)
            if (next && next !== current) img.setAttribute('src', next)
          })
        }

        fixImages(document)
        new MutationObserver(function (mutations) {
          mutations.forEach(function (m) {
            if (m.type === 'attributes' && m.target.tagName === 'IMG') {
              fixImages(m.target.parentNode || document)
              return
            }
            if (m.type !== 'childList') return
            m.addedNodes.forEach(function (node) {
              if (node.nodeType === 1) fixImages(node)
            })
          })
        }).observe(document.documentElement, {
          subtree: true,
          childList: true,
          attributes: true,
          attributeFilter: ['src'],
        })
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
